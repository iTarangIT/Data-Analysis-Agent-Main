# Golden questions for the phase 1 gate. Each case needs one of these expectations:
#   expect_value:    this value appears somewhere in the returned rows
#   expect_contains: this text appears in the answer or the rows (case-insensitive)
#   expect_type:     `number` (a numeric cell came back) or `rows` (any rows came back)
#
# `expect_chart: bar|line` may be added alongside any of the three, so a case can require both
# the right rows and the right picture.
#
# Two traps when writing a case. A superlative needs a unique winner, or a model answering
# correctly is marked wrong; see the note below. And never assert an exact value against a live
# source such as a web dashboard, because the number changes and the case fails tomorrow for a
# reason that has nothing to do with the agent.
#
# The phase 1 gate is 30 cases at >= 80% against the iTarang IoT database. The four below run
# against the seeded `demo` fixture and exist so the harness is testable today; they are
# replaced once the read-only DSN for `itarang` exists and its schema can be introspected.
# Add a case every time a real user gets a wrong answer.

- q: How many dealers do we have?
  expect_value: 3

- q: What is the total battery revenue in August 2026?
  expect_value: 157300

# A case is only usable if its answer is unique. "Which city has the most batteries sold?"
# was here and had to go: Gurugram and Nashik both have 2, so a model answering Gurugram was
# marked wrong for being right. Check every new case against the data for ties.
- q: Which city has sold the fewest batteries?
  expect_contains: Howrah

- q: What is the average temperature in telemetry over the last 24 hours?
  expect_type: number

# Missing-data cases, added with the handling policy. They run against the two fixture tables
# `scripts/demo_customer.sql` gained for the purpose: `trips`, which is empty, and `gps_pings`,
# whose data stops on 2026-07-02 with a partition already created ahead of it.
#
# The assertions are deliberately loose, for the reason the Antarctica case in golden_file.yaml
# records: a model that finds nothing legitimately runs a second query to see what does exist,
# so the rows are unpredictable and only the answer can be asserted on. What they distinguish
# is an answer that engages with the gap from one that says "no data found" and stops. They
# are weaker than the IoT cases will be and are not a substitute for them.

- q: How many trips have we recorded?
  expect_contains: trips

- q: What was the average GPS latitude in August 2026?
  expect_contains: july

# Added with forecasting: a history question worded like a trend, which has to stay with the
# query tool whether or not a forecasting model is loaded. No `expect_chart`: Postgres dates
# reach the chart rule as strings through MCP, so it draws a bar here.
- q: How has battery revenue moved month by month?
  expect_type: rows
