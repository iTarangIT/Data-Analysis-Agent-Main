# CI and VPS only. Local development uses one native Postgres on 5432 with the same three
# databases; see docs/DEVELOPMENT.md section 3. Never assume this file is running locally.
services:
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: analyst
    ports: ["5433:5432"]
    volumes: ["app-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  checkpoint-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ckpt
      POSTGRES_PASSWORD: ckpt
      POSTGRES_DB: checkpoints
    ports: ["5434:5432"]
    volumes: ["ckpt-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckpt -d checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-customer-db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports: ["5435:5432"]
    volumes:
      - "./scripts/demo_customer.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-db: {}
  ckpt-db: {}
