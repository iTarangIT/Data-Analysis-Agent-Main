name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyst-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyst-agent-backend/requirements.lock
      - run: |
          grep -v '^pywin32==' requirements.lock > requirements.linux.txt
          pip install -r requirements.linux.txt
          pip install --no-deps -e .
      - run: ruff check app tests
      - run: pytest -m "not integration and not forecast and not google"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyst-agent-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analyst-agent-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz -o release.tar.gz HEAD analyst-agent-backend analyst-agent-frontend deploy
      - name: Ship to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          printf '%s\n' "$KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o BatchMode=yes "root@$HOST" "$GITHUB_SHA" < release.tar.gz
